<template>
    <section class="health" aria-label="AI readiness health assessment" aria-live="polite">
        <h2>AI readiness health</h2>
        <p class="intro">Data, access, staff and privacy findings for the selected assessment scope.</p>
        <template lwc:if={loading}><p role="status">Checking AI readiness…</p></template>
        <template lwc:if={error}><p class="error" role="alert">{error}</p></template>
        <template lwc:if={hasResult}>
            <template lwc:if={stale}><p role="status">Governance inputs changed after this scan. Run the organization or selected implementation assessment again for current findings.</p></template>
            <template lwc:if={historyNotice}><p role="status">{historyNotice}</p></template>
            <p class="notice">{banner}</p><p class="observed">{sourceLabel} · Scanned: {observedAt} · Scope: {scope}</p>
            <p class="observed">{scanActor} · {scanAge}. Refresh for current data; use your approved review policy to decide when results expire.</p>
            <div class="cards">
                <article class="card"><h3>AI readiness health</h3><div class="ring" style={ringStyle}><span>{score}</span></div><p class="rating">{rating}</p><p>Score: passed checks divided by all defined checks. Unmeasured checks earn no points. Coverage shows how much could be measured. Critical failures can block a pilot regardless of score.</p></article>
                <article class="card"><h3>Checks completed</h3><p class="number">{coverage}</p><dl><div><dt>Passed</dt><dd>{passed}</dd></div><div><dt>Needs attention</dt><dd>{failed}</dd></div><div><dt>Not checked</dt><dd>{unknown}</dd></div></dl><p>Unavailable checks stay visible and do not count as passes.</p></article>
                <article class="card"><h3>Access inventory</h3><dl><template for:each={inventory} for:item="item"><div key={item.id}><dt>{item.label}<small>{item.note}</small></dt><dd>{item.countLabel}</dd></div></template></dl><p>Inventory is for review. An unused role or narrowly assigned permission set does not by itself establish a security risk.</p></article>
            </div>
            <div class="categories"><template for:each={categories} for:item="category"><article class="card" key={category.id}><h3>{category.label}</h3><p class="number">{category.scoreLabel}</p><p class="rating">{category.rating}</p><p>Checks completed: {category.coverageLabel}</p><p>{category.passed} passed · {category.failed} need attention · {category.unknown} not checked</p></article></template></div>
            <h3 class="findings-title" data-findings-heading tabindex="-1">AI readiness findings</h3>
            <p>Readiness is measured from evidence. A use case's business lifecycle status, such as Approved, does not establish readiness.</p>
            <div class="filters" role="group" aria-label="Filter AI readiness findings">
                <lightning-combobox label="Result" value={statusFilter} options={statusOptions} data-filter="statusFilter" onchange={handleFilter}></lightning-combobox>
                <lightning-combobox label="Severity" value={severityFilter} options={severityOptions} data-filter="severityFilter" onchange={handleFilter}></lightning-combobox>
                <lightning-button label="Clear filters" onclick={clearFilters}></lightning-button>
            </div>
            <p role="status">{filterSummary}</p>
            <template lwc:if={noMatches}><p>No findings match these filters. Clear filters to see the full assessment.</p></template>
            <lightning-tabset active-tab-value={categoryFilter}>
            <template for:each={findingTabs} for:item="group">
                <lightning-tab key={group.value} value={group.value} label={group.summary} onactive={handleCategoryTab}>
                    <div class="table-wrap"><table><caption class="slds-assistive-text">{group.label} findings</caption><thead><tr><th scope="col">Severity / result</th><th scope="col">Check</th><th scope="col">Group</th><th scope="col">Actual value</th><th scope="col">Expected value</th><th scope="col">Action</th></tr></thead><tbody><template for:each={group.rows} for:item="finding"><tr key={finding.id}><td><strong>{finding.severity}</strong><span class={finding.badgeClass}>{finding.statusLabel}</span></td><th scope="row">{finding.label}</th><td>{finding.group}</td><td>{finding.actual}</td><td>{finding.expected}</td><td><template lwc:if={finding.safeUrl}><a href={finding.safeUrl}>{finding.action}</a></template><template lwc:else>{finding.action}</template><template lwc:if={finding.hasChecklist}><button type="button" data-id={finding.id} onclick={openChecklist}>Answer in checklist</button></template><details class="advice"><summary>Why and how to address this</summary><p>{finding.why}</p><p>{finding.how}</p></details></td></tr></template></tbody></table></div>
                </lightning-tab>
            </template>
            </lightning-tabset>
        </template>
        <template lwc:else><template lwc:if={loading}></template><template lwc:else><template lwc:if={error}></template><template lwc:else><p>Run assessment to measure AI readiness health and see the settings that need attention.</p></template></template></template>
    </section>
</template>
