<template>
    <section aria-label="AI implementation workspace" class="workspace">
        <h2>{pageTitle}</h2>
        <p>{pageDescription}</p>
        <template lwc:if={busy}><lightning-spinner size="small" alternative-text="Loading workspace"></lightning-spinner></template>
        <template lwc:if={error}><p role="alert" class="error">{error}</p></template>
        <template lwc:if={message}><p role="status">{message}</p></template>
        <lightning-combobox label="Implementation" value={selectedId} options={caseOptions} onchange={selectCase} disabled={busy}></lightning-combobox>
        <template lwc:if={showCases}>
        <details data-case-form>
            <summary>Implementation purpose, scope and responsibility</summary>
            <p>Implementation name, business owner and purpose are required. Never enter passwords, tokens, donor records or sensitive personal information here. Grounding fields must use Object.Field identifiers. Enter the full Salesforce username of the AI integration account. The actual AI identity remains distinct from the person running this app.</p>
            <div class="fields">
                <template for:each={caseFields} for:item="field">
                    <lightning-textarea key={field.key} label={field.label} value={field.value} data-field={field.key} onchange={changeCase} disabled={disabled} maxlength={field.maximum}></lightning-textarea>
                </template>
                <lightning-combobox label="Business lifecycle status" value={lifecycle} options={statuses} data-field="status" onchange={changeCase} disabled={disabled}></lightning-combobox>
            </div>
            <div class="fields">
                <lightning-input type="number" label="Maximum record age in days" min="1" max="3650" step="1" value={freshDays} data-field="freshDays" onchange={changeCase} disabled={disabled}></lightning-input>
                <lightning-input type="number" label="Minimum completeness percentage" min="0" max="100" step="0.1" value={minimumCompleteness} data-field="minimumCompleteness" onchange={changeCase} disabled={disabled}></lightning-input>
            </div>
            <lightning-input type="checkbox" label="These thresholds have an approved policy and recorded reference" checked={policyApproved} data-field="policyApproved" onchange={changeCase} disabled={disabled}></lightning-input>
            <p>Thresholds are used only with approval and a policy reference. Unapproved policy does not pass a check.</p>
            <p>Approved describes a business decision. It does not mean the assessment passed.</p>
            <lightning-button label="Save implementation" onclick={saveCase} disabled={disabled}></lightning-button>
        </details>
        <lightning-button label="Run scoped assessment" onclick={runScan} disabled={scanDisabled}></lightning-button>
        <template lwc:if={historyMessage}><p role="status">{historyMessage}</p></template>
        <template lwc:if={dirty}><p>Save this implementation before running a scoped assessment.</p></template>
        <template lwc:if={noRecorder}><p>Your role cannot save assessment history. Ask your administrator for the narrowly scoped recorder permission.</p></template>
        </template>
        <template lwc:if={localReport}><c-readiness-org-health onopenchecklist={navigateChecklist}></c-readiness-org-health></template>
        <template lwc:if={showChecklists}>
        <template lwc:if={combinedMode}><h2>Guided checklists</h2></template>
        <lightning-radio-group label="Checklist scope" options={scopes} value={scope} type="button" onchange={changeScope}></lightning-radio-group>
        <div class="fields">
            <lightning-combobox label="Stage" value={currentStage} options={stages} onchange={changeStage}></lightning-combobox>
            <lightning-combobox label="Find accountable gaps" value={accountability} options={accountabilityOptions} onchange={changeFilter}></lightning-combobox>
        </div>
        <template lwc:if={needsImplementation}><p>Select and save an implementation to answer its checklist.</p></template>
        <template for:each={questions} for:item="question">
            <article key={question.key}>
                <h3 tabindex="-1" data-question={question.id}>{question.label}</h3>
                <details><summary>Why this matters and what to do</summary><p>{question.advice}</p></details>
                <lightning-radio-group label="Reported answer" value={question.answer} options={answerChoices} data-key={question.key} data-field="answer" onchange={changeAnswer} disabled={disabled}></lightning-radio-group>
                <div class="fields">
                    <lightning-input label="Responsible person or role" value={question.responsible} data-key={question.key} data-field="responsible" maxlength="2000" onchange={changeAnswer} disabled={disabled}></lightning-input>
                    <lightning-input type="date" label="Due date" value={question.dueDate} data-key={question.key} data-field="dueDate" onchange={changeAnswer} disabled={disabled}></lightning-input>
                    <lightning-input label="Evidence reference, no personal data" value={question.evidence} data-key={question.key} data-field="evidence" maxlength="2000" onchange={changeAnswer} disabled={disabled}></lightning-input>
                    <lightning-input type="date" label="Review date" value={question.reviewDate} data-key={question.key} data-field="reviewDate" onchange={changeAnswer} disabled={disabled}></lightning-input>
                </div>
                <lightning-textarea label="Notes" value={question.notes} data-key={question.key} data-field="notes" maxlength="2000" onchange={changeAnswer} disabled={disabled}></lightning-textarea>
                <template lwc:if={question.overdue}><p class="error">Overdue gap</p></template>
                <template lwc:if={question.unassigned}><p>Assign a responsible person or role.</p></template>
                <p>{question.audit}</p>
                <p>Review age: {question.reviewAge}. Follow your approved review policy.</p>
                <lightning-button label="Save answer" data-key={question.key} onclick={saveQuestion} disabled={disabled}></lightning-button>
            </article>
        </template>
        <p>Use Staff exercises for observed competency. These checklists cannot establish staff competency or legal compliance.</p>
        </template>
        <template lwc:if={showHistory}>
        <template lwc:if={combinedMode}><h2>Saved assessment history</h2></template>
        <p>Each assessment retains its own time, actor, scope and rubric. Later scans do not rewrite earlier findings.</p>
        <div class="fields">
            <lightning-combobox label="Saved assessment" value={historyId} options={historyOptions} onchange={chooseHistory} disabled={busy}></lightning-combobox>
            <lightning-combobox label="Compare with" value={comparisonId} options={historyOptions} data-comparison="true" onchange={chooseHistory} disabled={busy}></lightning-combobox>
        </div>
        <p role="status">{comparisonWarning}</p>
        <div class="fields">
            <template for:each={snapshotRows} for:item="snapshot">
                <section key={snapshot.key} class="snapshot" aria-label={snapshot.label}>
                    <h3>{snapshot.label}</h3>
                    <p>Saved assessment: {snapshot.assessmentId} | Implementation: {snapshot.useCaseId}</p>
                    <p>Scope: {snapshot.scope}</p>
                    <details><summary>Recorded scope definition</summary><template for:each={snapshot.scopeDetails} for:item="detail"><p key={detail.key}>{detail.label}: {detail.value}</p></template></details>
                    <p>Rubric: {snapshot.version} | Observed: {snapshot.observedAt}</p>
                    <p>{snapshot.age}. This is a saved observation. Run a new assessment to obtain current data; apply your approved review policy.</p>
                    <p>Score: {snapshot.score} | Checks completed: {snapshot.coverage}</p>
                    <p>Passed: {snapshot.passed} | Needs attention: {snapshot.failed} | Unknown: {snapshot.unknown}</p>
                    <template for:each={snapshot.findings} for:item="finding">
                        <article key={finding.key}>
                            <h3>{finding.title}</h3><p>{finding.outcome}</p>
                            <p>Actual: {finding.actual}</p><p>Expected: {finding.expected}</p><p>{finding.action}</p>
                        </article>
                    </template>
                </section>
            </template>
        </div>
        </template>
    </section>
</template>
