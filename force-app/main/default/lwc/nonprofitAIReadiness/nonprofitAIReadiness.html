<template>
    <section class="workspace slds-card" aria-label="Nonprofit AI readiness assessment">
        <header class="slds-page-header slds-theme_default">
            <h1 class="slds-page-header__title">AI Readiness</h1>
            <p class="slds-m-vertical_small">Assess data, access, staff and privacy readiness before an AI pilot.</p>
            <lightning-badge label="Summary results only"></lightning-badge>
        </header>
        <div class="body slds-p-around_medium">
            <section class="connection-guidance slds-box slds-m-bottom_medium" aria-label="Before connecting AI">
                <div class="slds-media">
                    <lightning-icon class="slds-media__figure" icon-name="utility:shield" size="small" alternative-text="Security guidance"></lightning-icon>
                    <div class="slds-media__body">
                        <h2 class="slds-text-heading_small">Before you connect AI: never use a System Administrator account</h2>
                        <p class="slds-m-vertical_small">Give each AI connection, agent or MCP integration its own dedicated Salesforce integration user. Grant only the objects, fields and actions required for its use case. Register the connection and its actual integration username so the assessment can inspect that account's configuration. Configuration checks do not prove the assistant's runtime behavior.</p>
                        <button type="button" class="connection-button slds-button slds-button_neutral" onclick={handleRegisterConnection}>Register an AI connection</button>
                    </div>
                </div>
            </section>
            <div class="controls">
                <lightning-combobox label="Contact data scope" value={scenario} options={scenarioOptions} onchange={handleScenarioChange} disabled={assessmentDisabled}></lightning-combobox>
                <lightning-button label="Run assessment" variant="brand" onclick={handleRun} disabled={assessmentDisabled}></lightning-button>
                <lightning-button label="View recommended actions" variant="neutral" onclick={handleViewActions} disabled={actionsDisabled}></lightning-button>
                <template lwc:if={lastChecked}><p class="checked">Last checked: {lastChecked}</p></template>
            </div>
            <p class="scope">{scopeLabel}</p>
            <template lwc:if={loading}><div class="loading" role="status"><lightning-spinner alternative-text="Running readiness checks" size="small"></lightning-spinner><p>Checking org health, contact data and readiness controls…</p></div></template>
            <template lwc:if={error}><div class="notice error" role="alert">{error}</div></template>
            <div class="slds-tabs_default">
                <ul class="slds-tabs_default__nav" role="tablist" aria-label="Readiness result categories">
                    <template for:each={resultTabs} for:item="tab">
                        <li key={tab.value} class={tab.className} role="presentation">
                            <button class="slds-tabs_default__link result-tab" role="tab" id={tab.id} aria-controls={tab.panelId} aria-selected={tab.selected} tabindex={tab.tabIndex} data-tab={tab.value} onclick={handleResultTab} onkeydown={handleResultTabKey}>{tab.label}</button>
                        </li>
                    </template>
                </ul>
                <div id="readiness-panel-overview" class="slds-tabs_default__content" role="tabpanel" aria-labelledby="readiness-tab-overview" hidden={hideOverview}>
<c-readiness-org-health onopenchecklist={handleOpenChecklist}></c-readiness-org-health>
<template lwc:if={showOrganizationRecommendations}>                    <section class="panel actions" aria-label="Recommended next steps"><h2 data-actions-heading tabindex="-1">Recommended next steps</h2><p class="scope">Recommendations follow the same assessment rules each time.</p><ol><template for:each={recommendations} for:item="action"><li key={action.key}><span class={action.priorityClass}>{action.priority}</span> <strong>{action.owner}:</strong> {action.text}<p class="impact">{action.impact}</p><a class="learning-link" href={action.learning.url} target="_blank" rel="noopener noreferrer">{action.learning.label}<span class="slds-assistive-text"> (opens in a new tab)</span></a><template lwc:if={action.extraUrl}><a class="learning-link" href={action.extraUrl} target="_blank" rel="noopener noreferrer">{action.extraLabel}<span class="slds-assistive-text"> (opens in a new tab)</span></a></template></li></template></ol><template lwc:if={isOrganizationScope}><template lwc:if={hasMetrics}><template lwc:if={canCreateFollowUp}><div class="follow-ups"><p class="scope">{followUpCount} follow-ups, assigned to you. Matching open tasks are reused and their assessment priorities refreshed.</p><lightning-button label="Create my follow-up tasks" variant="brand" onclick={handleCreateTasks} disabled={tasksDisabled}></lightning-button><template lwc:if={savingTasks}><p class="scope" role="status">Creating your follow-up tasks…</p></template><template lwc:if={taskMessage}><p class="task-result" role="status">{taskMessage}</p><a href="/lightning/o/Task/list">View my tasks</a></template><template lwc:if={taskError}><p class="task-error" role="alert">{taskError}</p></template></div></template><template lwc:else><p class="scope">Creating follow-up tasks requires Readiness Follow Up access.</p></template></template></template></section></template>
                </div>
                <div id="readiness-panel-contacts" class="slds-tabs_default__content" role="tabpanel" aria-labelledby="readiness-tab-contacts" hidden={hideContacts}>
<template lwc:if={result}><div class="notice">{banner}</div>                    <template lwc:if={hasMetrics}>
                        <section class="panel" aria-label="Contact data summary"><h2>Contact data summary</h2><dl class="counts"><template for:each={metrics} for:item="metric"><div key={metric.label}><dt>{metric.label}</dt><dd>{metric.value}</dd></div></template></dl><p class="scope">Repeated addresses can be shared intentionally. This is an indicator for review, not proof of duplicate people.</p></section>
                    </template>
                    <section class="panel" aria-label="Data check results"><h2>Data checks</h2><div class="table-wrap"><table class="slds-table slds-table_cell-buffer slds-table_bordered"><thead><tr><th scope="col">Check</th><th scope="col">Result</th></tr></thead><tbody><template for:each={checks} for:item="check"><tr key={check.key}><th scope="row">{check.label}</th><td><span class={check.badgeClass}>{check.status}</span></td></tr></template></tbody></table></div></section>
</template><template lwc:else><p class="empty">Run assessment to see Contact data results.</p></template>
                </div>
                <div id="readiness-panel-configuration" class="slds-tabs_default__content" role="tabpanel" aria-labelledby="readiness-tab-configuration" hidden={hideConfiguration}>
<template lwc:if={result}>                    <section class="panel" aria-label="Measured organization configuration">
                        <h2>Measured organization configuration</h2>
                        <p class="scope">Package role checks below describe this app’s configuration. Org-wide findings are on Overview; executed safeguards and deletion probes are on the Safeguard tests app tab.</p>
                        <template lwc:if={orgConfigurationError}><p class="scope">{orgConfigurationError}</p></template>
                        <template lwc:if={orgConfiguration}>
                            <p class="scope">{configurationSource}</p>
                            <div class="table-wrap"><table class="slds-table slds-table_cell-buffer slds-table_bordered"><thead><tr><th scope="col">Area</th><th scope="col">Check</th><th scope="col">Result</th><th scope="col">Measured basis</th></tr></thead><tbody><template for:each={configurationChecks} for:item="check"><tr key={check.key}><td>{check.area}</td><th scope="row">{check.label}</th><td>{check.statusLabel}</td><td>{check.basis}</td></tr></template></tbody></table></div>
                        </template>
                    </section>
</template><template lwc:else><p class="empty">Run assessment to see package configuration checks.</p></template>
                </div>
                <div id="readiness-panel-licenses" class="slds-tabs_default__content" role="tabpanel" aria-labelledby="readiness-tab-licenses" hidden={hideLicenses}>
<template lwc:if={result}>                    <section class="panel" aria-label="Organization licenses and features">
                        <h2>Organization licenses and features</h2>
                        <p class="scope">Assigned seats are not proof of active use. Feature availability does not establish that a feature is configured or used.</p>
                        <template lwc:if={inventoryError}><p class="scope">{inventoryError}</p></template>
                        <template lwc:if={inventory}>
                            <p class="scope">{inventory.limitations}</p><h3 class="inventory-heading">AI-related licenses</h3>
                            <div class="table-wrap"><table class="slds-table slds-table_cell-buffer slds-table_bordered"><thead><tr><th scope="col">License</th><th scope="col">Total seats</th><th scope="col">Assigned</th><th scope="col">Not assigned</th><th scope="col">Why it matters</th></tr></thead><tbody><template for:each={licenses} for:item="license"><tr key={license.key}><th scope="row">{license.name}</th><td>{license.total}</td><td>{license.assigned}</td><td>{license.remaining}</td><td>{license.relevance}</td></tr></template></tbody></table></div>
                            <p class="scope">Review relevant entitlements and setup with your Salesforce administrator. Assignments do not prove use. A missing AI license row does not settle licensing requirements; actual AI enablement and usage are not verified.</p>
                            <h3 class="inventory-heading">Feature availability</h3>
                            <div class="table-wrap"><table class="slds-table slds-table_cell-buffer slds-table_bordered"><thead><tr><th scope="col">Feature</th><th scope="col">Availability</th><th scope="col">Visible records</th><th scope="col">Usage</th></tr></thead><tbody><template for:each={capabilities} for:item="capability"><tr key={capability.name}><th scope="row">{capability.name}</th><td>{capability.availabilityLabel}</td><td>{capability.countLabel}</td><td>Not verified</td></tr></template></tbody></table></div>
                            <p class="scope">Counts only include records you can access. Hidden or unavailable information is not evidence of non-use. Small-group counts are withheld.</p>
                        </template>
                    </section>
</template><template lwc:else><p class="empty">Run assessment to see licenses and features.</p></template>
                </div>
            </div>
            <footer>Only summary counts and structured exercise outcomes are shared with assessment assistants. Names, source notes and evidence references are excluded. Small-group contact results are withheld.</footer>
        </div>
    </section>
</template>
