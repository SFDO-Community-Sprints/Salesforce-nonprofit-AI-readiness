<template>
    <section class="review" aria-labelledby="staff-title">
        <h2 id="staff-title" class="slds-text-heading_medium">Staff readiness exercises</h2>
        <p class="slds-m-top_small">Record your observed review of seven fictional exercises. This is your saved evidence, not an assessment of every staff member. Missing observations remain unknown.</p>
        <p class="slds-m-top_x-small">Use an evidence reference such as TRAINING-001. Keep names, personal details and sensitive notes outside this form.</p>
        <p class="slds-m-top_x-small">Saving makes your calculated exercise outcomes available to your assessment assistants. Evidence references and documents are excluded.</p>
        <template lwc:if={loading}>
            <div class="loading"><lightning-spinner alternative-text="Loading staff review" size="small"></lightning-spinner></div>
        </template>
        <template lwc:if={latest}>
            <div class="summary slds-m-top_medium">
                <p><strong>Latest own review:</strong> {score} score · {coverage} evidence coverage</p>
                <template lwc:if={reviewedAt}><p>Saved <lightning-formatted-date-time value={reviewedAt} year="numeric" month="short" day="2-digit" hour="2-digit" minute="2-digit"></lightning-formatted-date-time></p></template>
                <p>{freshnessSummary}</p>
                <ul class="slds-list_dotted slds-m-top_small"><template for:each={savedChecks} for:item="check"><li key={check.id}>{check.label}: {check.outcome}</li></template></ul>
                <p>To replace this review, record a new set of observations below.</p>
            </div>
        </template>
        <div class="slds-m-top_medium">
            <lightning-input type="checkbox" label="Apply an approved evidence age policy" checked={useFreshness}
                data-field="useFreshness" onchange={changePolicy} disabled={saving}></lightning-input>
            <template lwc:if={useFreshness}>
                <p>Agree the age limit before assessing. Enter today's date in Salesforce. Saved reviews are reassessed on the Salesforce date each time they are retrieved. Missing or expired observation dates remain unknown; confirmed critical failures still block.</p>
                <lightning-input type="date" label="Assessment date (today in Salesforce)" value={asOf} required
                    data-field="asOf" onchange={changePolicy} disabled={saving}></lightning-input>
                <lightning-input type="number" label="Approved maximum evidence age in days" value={maxAgeDays}
                    min="0" max="2147483647" step="1" required data-field="maxAgeDays" onchange={changePolicy} disabled={saving}></lightning-input>
            </template>
        </div>
        <lightning-accordion allow-multiple-sections-open class="slds-m-top_medium">
            <template for:each={questions} for:item="question">
                <lightning-accordion-section key={question.id} name={question.id} label={question.title}>
                    <p class="scenario">{question.scenario}</p>
                    <template for:each={question.required_actions} for:item="action">
                        <lightning-combobox key={action.id} label={action.criterion} value={action.value} options={choices}
                            data-question={question.id} data-action={action.id} onchange={changeQuestion} disabled={saving}></lightning-combobox>
                    </template>
                    <fieldset class="critical slds-m-top_medium">
                        <legend class="slds-text-title_bold">Observed unsafe actions</legend>
                        <p>Select only failures actually demonstrated in the exercise.</p>
                        <template for:each={question.critical_failures} for:item="failure">
                            <lightning-input key={failure.id} type="checkbox" label={failure.criterion} checked={failure.checked}
                                data-question={question.id} data-failure={failure.id} onchange={changeQuestion} disabled={saving}></lightning-input>
                        </template>
                    </fieldset>
                    <lightning-input class="slds-m-top_medium" type="text" label="Evidence reference" value={question.evidence_ref}
                        pattern="[A-Za-z0-9_-]{1,80}" maxlength="80" message-when-pattern-mismatch="Use 1–80 letters, numbers, hyphens or underscores."
                        field-level-help="Reference a protected training record or exercise result; do not enter names or notes."
                        data-question={question.id} data-field="evidence" onchange={changeQuestion} disabled={saving}></lightning-input>
                    <template lwc:if={useFreshness}>
                        <lightning-input type="date" label="Observation date supported by the evidence" value={question.observed_on}
                            max={asOf} data-question={question.id} data-field="observed_on" onchange={changeQuestion} disabled={saving}></lightning-input>
                    </template>
                    <lightning-input type="checkbox" label="I confirm these are reviewed observations supported by the referenced evidence."
                        checked={question.reviewer_confirmed} data-question={question.id} data-field="confirmation" onchange={changeQuestion} disabled={saving}></lightning-input>
                </lightning-accordion-section>
            </template>
        </lightning-accordion>
        <template lwc:if={error}><p role="alert" class="slds-text-color_error slds-m-top_medium">{error}</p></template>
        <template lwc:if={message}><p role="status" class="slds-m-top_medium">{message}</p></template>
        <template lwc:if={canReview}>
        <div class="slds-m-top_medium">
            <lightning-button variant="brand" label="Save staff review" onclick={save} disabled={disabled}></lightning-button>
            <template lwc:if={saving}><span class="slds-m-left_small" role="status">Saving observed review…</span></template>
        </div>
        </template>
        <template lwc:else><p class="slds-m-top_medium">Saving reviewed staff evidence requires reviewer access. Contact your Salesforce administrator.</p></template>
    </section>
</template>
